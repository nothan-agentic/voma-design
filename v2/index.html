<title>VOMA bản 2.0</title>
<style>
  /* =========================================================================
     VOMA — bản thiết kế chốt
     Màu: voma-ui-kit/tokens.css v1.3.1, nguyên giá trị, không thêm màu mới.
     Chữ: Be Vietnam Pro (khai báo trong tailwind-preset của kit).
     Một chế độ sáng — kit chưa khai báo token tối.
     ========================================================================= */
  :root {
    /* ---- token kit ---- */
    --primary: #005eb8;
    --primary-dark: #003a70;
    --primary-soft: #e3f2fd;
    --success: #2e7d32;
    --warning: #ef6c00;
    --error: #c62828;
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-hover: #f9f9f9;
    --line-light: #e0e0e0;
    --line-dark: #757575;
    --text-dark: #101820;
    --st-success-fg: #1b5e20; --st-success-bg: #e8f5e9;
    --st-error-fg: #c62828;   --st-error-bg: #ffebee;
    --st-warning-fg: #e65100; --st-warning-bg: #fff3e0;
    --st-prog-fg: #1565c0;    --st-prog-bg: #e3f2fd;
    --st-neutral-fg: #424242; --st-neutral-bg: #f5f5f5;

    /* ---- neutral suy ra, dùng cho chữ phụ và nền phụ ---- */
    --ink: #101820;
    --ink-2: #45525f;
    --muted: #78859a;
    --hair: #eef1f5;
    --shadow-sm: 0 1px 2px rgba(16, 24, 32, .06);
    --shadow-md: 0 10px 28px -12px rgba(16, 24, 32, .28);
    --shadow-lg: 0 26px 60px -18px rgba(16, 24, 32, .45);

    /* ---- mật độ: chỉ ba biến này đổi ---- */
    --row-h: 44px;
    --fs-table: 13.5px;
    --pad-y: 10px;

    /* ---- thang vai trò: MỘT hue (chàm ~265), phân cấp bằng độ đậm.
       Cố ý không lấy từ bánh xe màu: 5 hue trạng thái đã có nghĩa cố định. ---- */
    --role-3: #33257a;   /* admin  — sâu nhất */
    --role-2: #56479f;   /* staff  — ngang hàng nhau */
    --role-1: #7c71b5;   /* viewer — nông nhất */

    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: "Be Vietnam Pro", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-density="tight"]  { --row-h: 34px; --fs-table: 13px;   --pad-y: 7px; }
  :root[data-density="roomy"]  { --row-h: 44px; --fs-table: 13.5px; --pad-y: 10px; }
  :root[data-density="scan"]   { --row-h: 62px; --fs-table: 16px;   --pad-y: 16px; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select { font-family: inherit; }
  ::selection { background: var(--primary-soft); }

  /* =============== nút — ánh xạ AppButton của kit =============== */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .btn-md { min-width: 96px; min-height: 48px; font-size: 16px; font-weight: 700; padding: 0 16px; }
  .btn-sm { min-width: 80px; min-height: 36px; font-size: 15px; font-weight: 400; padding: 0 14px; }
  .btn-icon { width: 40px; height: 40px; min-width: 0; padding: 0; }
  .btn-primary { background: var(--primary); color: #fff; border: 1px solid transparent; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--surface); color: var(--primary); border: 1px solid var(--primary); }
  .btn-secondary:hover { background: var(--primary-soft); }
  .btn-cancel { background: var(--surface); color: var(--text-dark); border: 1px solid var(--line-dark); }
  .btn-cancel:hover { background: var(--surface-hover); }
  .btn-danger { background: var(--surface); color: var(--text-dark); border: 1px solid var(--error); }
  .btn-danger:hover { background: var(--st-error-bg); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .navb:disabled, .otab:disabled, .it.dis, .qb:disabled { opacity: .45; cursor: not-allowed; }
  .btn:focus-visible, .lnk:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn kbd { font-family: var(--mono); font-size: 11px; font-weight: 400; border: 1px solid currentColor; border-radius: 3px; padding: 0 5px; opacity: .7; }

  .lnk { border: 0; background: none; color: var(--primary); cursor: pointer; padding: 0; font: inherit; }
  .lnk:hover { text-decoration: underline; }

  /* =============== chip trạng thái — AppStatusChip =============== */
  .chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip-success { color: var(--st-success-fg); background: var(--st-success-bg); }
  .chip-error { color: var(--st-error-fg); background: var(--st-error-bg); }
  .chip-warning { color: var(--st-warning-fg); background: var(--st-warning-bg); }
  .chip-in-progress { color: var(--st-prog-fg); background: var(--st-prog-bg); }
  .chip-neutral { color: var(--st-neutral-fg); background: var(--st-neutral-bg); }
  .chip.sm { font-size: 11px; padding: 1px 8px; }

  /* =============== thanh trên =============== */
  .topbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line-light); flex: none; }
  .logo { display: flex; align-items: center; gap: 9px; flex: none; }
  .logo .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .logo .word { font-weight: 800; letter-spacing: .14em; font-size: 13px; }
  .sellersel { display: flex; align-items: center; gap: 9px; border: 1px solid var(--line-light); border-radius: 8px; background: var(--surface); padding: 5px 11px; cursor: pointer; flex: none; }
  .sellersel .cap { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .sellersel .val { font-size: 13.5px; font-weight: 650; }
  .sellersel:hover { border-color: var(--primary); }
  .sellersel .car { color: var(--muted); font-size: 10px; }
  .omni { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; border: 1px solid var(--line-light); background: var(--bg); border-radius: 8px; padding: 7px 12px; color: var(--muted); font-size: 13.5px; cursor: pointer; }
  .omni:hover { border-color: var(--primary); color: var(--primary); }
  .omni .k { margin-left: auto; }
  .kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line-light); border-radius: 4px; padding: 1px 5px; background: var(--surface); color: var(--muted); white-space: nowrap; }
  .who { display: flex; align-items: center; gap: 9px; flex: none; cursor: pointer; }
  .who .nm { text-align: right; line-height: 1.2; }
  .who .nm b { display: block; font-size: 12.5px; }
  .who .nm span { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .who .av { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12.5px; }
  @media (max-width: 1000px) { .who .nm { display: none; } }
  @media (max-width: 700px) { .omni span:not(.k) { display: none; } .sellersel .cap { display: none; } }

  /* =============== khung chính =============== */
  .app { display: flex; flex-direction: column; height: 100vh; }
  .body { display: grid; grid-template-columns: 214px minmax(0, 1fr); flex: 1; min-height: 0; }
  .body.scan { grid-template-columns: minmax(0, 1fr); }
  .body.scan .sidebar { display: none; }
  @media (max-width: 1000px) { .body { grid-template-columns: 58px minmax(0, 1fr); } .sidebar .lbl, .sidebar .grp { display: none; } .sidebar .navb { justify-content: center; } }

  .sidebar { background: var(--surface); border-right: 1px solid var(--line-light); padding: 10px 9px; overflow-y: auto; }
  .sidebar .grp { font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
  .sidebar .grp:first-child { padding-top: 2px; }
  .navb { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 9px 10px; font-size: 13.5px; font-weight: 550; color: var(--ink-2); cursor: pointer; }
  .navb:hover { background: var(--primary-soft); color: var(--primary-dark); }
  .navb[aria-current="page"] { background: var(--primary); color: #fff; }
  .navb:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .navb svg { width: 17px; height: 17px; flex: none; }
  .navb .badge { margin-left: auto; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; border-radius: 999px; padding: 0 7px; background: var(--st-neutral-bg); color: var(--st-neutral-fg); }
  .navb .badge.hot { background: var(--st-warning-bg); color: var(--st-warning-fg); font-weight: 600; }
  .navb[aria-current="page"] .badge { background: rgba(255,255,255,.24); color: #fff; }

  .canvas { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* =============== đầu trang =============== */
  .phead { padding: 11px 22px 0; flex: none; display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
  .phead .crumb { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); flex: none; }
  .phead h1 { margin: 0; font-size: 19.5px; font-weight: 740; letter-spacing: -.022em; flex: none; }
  .phead .viewtabs { padding: 0; margin: 0; flex: 1 1 auto; }
  .phead .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }
  .phead .sep { width: 1px; height: 18px; background: var(--line-light); flex: none; }


  /* =============== bảng =============== */
  .tablewrap { flex: 1; min-height: 0; overflow: auto; background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-table); }
    /* nền dẫn xuất từ --primary, KHÔNG phải mã màu mới; trình duyệt cũ rơi về surface */
  thead th { position: sticky; top: 0; z-index: 2; text-align: left; font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; padding: 9px 12px; background: var(--surface); background: color-mix(in srgb, var(--primary) 6%, var(--surface)); border-bottom: 1.5px solid var(--line-dark); white-space: nowrap; user-select: none; }
  thead th.num { text-align: right; }
  thead th.sortable { cursor: pointer; }
  thead th.sortable:hover { color: var(--primary); }
  thead th .ar { display: none; margin-left: 5px; font-size: 9px; }
  thead th.sorted { color: var(--primary); }
  thead th.sorted .ar { display: inline; }
  thead th.pick { width: 38px; padding-left: 12px; }
  tbody td { padding: 0 12px; height: var(--row-h); border-bottom: 1px solid var(--hair); color: var(--ink-2); white-space: nowrap; }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody td.mono { font-family: var(--mono); font-size: calc(var(--fs-table) - .5px); color: var(--ink); }
  tbody td b { color: var(--ink); font-weight: 600; }
  tbody td .second { display: block; font-size: 11.5px; color: var(--muted); }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--surface-hover); }
  tbody tr.cur td { background: var(--primary-soft); box-shadow: inset 0 0 0 1px rgba(0, 94, 184, .25); }
  tbody tr.marked td { background: #f1f7fd; }
  tbody tr.cur.marked td { background: var(--primary-soft); }
  .tick { width: 16px; height: 16px; border: 1.5px solid var(--line-dark); border-radius: 4px; display: inline-grid; place-items: center; font-size: 10px; background: var(--surface); color: transparent; }
  .tick.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .tick.some { background: var(--primary); border-color: var(--primary); color: #fff; font-size: 13px; line-height: 0; }
  .tick.head { cursor: pointer; }

  /* =============== thanh lọc + view =============== */
  .filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 22px 11px; flex: none; }
  .filterbar .count { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .viewtabs { display: flex; gap: 6px; flex-wrap: wrap; flex: none; }
  .viewtab { border: 1px solid var(--line-light); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13px; color: var(--ink-2); cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
  .viewtab:hover { border-color: var(--primary); color: var(--primary); }
  .viewtab[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .viewtab .n { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; opacity: .82; }
  .viewtab.ghost { border-style: dashed; color: var(--muted); }
  .searchbox { flex: 1; min-width: 180px; max-width: 380px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-light); border-radius: 8px; background: var(--surface); padding: 8px 12px; }
  .searchbox input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font: inherit; color: var(--ink); }
  .fbtn { border: 1px solid var(--line-light); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 13px; color: var(--ink-2); cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
  .fbtn:hover { border-color: var(--primary); color: var(--primary); }
  .fbtn.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); font-weight: 600; }

  /* =============== bảng chọn neo tại chỗ =============== */
  .menu { position: fixed; z-index: 90; min-width: 246px; max-width: 340px; background: var(--surface); border: 1px solid var(--line-light); border-radius: 12px; box-shadow: var(--shadow-md); padding: 6px; display: none; }
  .menu.open { display: block; }
  .menu .mcap { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 5px; }
  .menu .mi { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 8px 10px; cursor: pointer; font: inherit; font-size: 13.5px; color: var(--ink); }
  .menu .mi:hover { background: var(--primary-soft); }
  .menu .mi[aria-current="true"] { background: var(--primary-soft); color: var(--primary-dark); font-weight: 600; }
  .menu .mi .t2 { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
  .menu .mi .ck { margin-left: auto; color: var(--primary); font-size: 12px; }
  .menu .msep { height: 1px; background: var(--line-light); margin: 5px 4px; }
  .menu .mrow { display: flex; gap: 6px; padding: 4px 6px 8px; }
  .menu .mrow button { flex: 1; border: 1px solid var(--line-light); background: var(--surface); border-radius: 8px; padding: 6px 4px; font: inherit; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  .menu .mrow button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .menuscrim { position: fixed; inset: 0; z-index: 89; display: none; }
  .menuscrim.open { display: block; }
  .rolebadge { font-family: var(--mono); font-size: 10px; font-weight: 600; }
  .rolebadge.r3 { color: var(--role-3); }
  .rolebadge.r2 { color: var(--role-2); }
  .rolebadge.r1 { color: var(--role-1); }
  .roledot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* =============== khung xem nhanh =============== */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 400px; flex: 1; min-height: 0; }
  @media (max-width: 1240px) { .split { grid-template-columns: minmax(0, 1fr) 340px; } }
  @media (max-width: 980px) { .split { grid-template-columns: minmax(0, 1fr); } .peek { display: none; } }
  .peek { border-left: 1px solid var(--line-light); background: var(--surface); overflow-y: auto; display: flex; flex-direction: column; }
  .pinbar { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line-light); overflow-x: auto; background: var(--bg); flex: none; }
  .pinbar .pin { flex: none; border: 1px solid var(--line-light); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-family: var(--mono); color: var(--ink-2); cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
  .pinbar .pin[aria-current="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); }
  .pinbar .empty { font-size: 11.5px; color: var(--muted); padding: 3px 2px; }
  .peekbody { padding: 16px 18px 22px; }
  .peekbody h2 { margin: 0 0 3px; font-size: 19px; font-weight: 740; letter-spacing: -.02em; font-variant-numeric: tabular-nums; word-break: break-word; }
  .peekbody .psub { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }

  /* =============== tab đối tượng =============== */
  .otabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-light); overflow-x: auto; flex: none; }
  .otab { flex: none; border: 0; background: none; font-size: 13.5px; font-weight: 600; color: var(--ink-2); padding: 9px 13px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  .otab:hover { color: var(--primary); }
  .otab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
  .otab:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
  .otab .src { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

  /* =============== khối nội dung =============== */
  .scrollarea { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 22px 26px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, .9fr); gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(224px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line-light); border-radius: 10px; padding: 16px 17px; margin-bottom: 14px; }
  .card:last-child { margin-bottom: 0; }
  .card > h3 { margin: 0 0 12px; font-family: var(--mono); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .card > h3 .right { margin-left: auto; }
  .dl { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; font-size: 13.5px; }
  .dl dt { color: var(--muted); }
  .dl dd { margin: 0; text-align: right; color: var(--ink); font-weight: 550; font-variant-numeric: tabular-nums; word-break: break-word; }
  .lrow { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; }
  .lrow:last-child { border-bottom: 0; }
  .lrow .l { color: var(--ink-2); }
  .lrow .l b { display: block; color: var(--ink); }
  .lrow .r { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); font-weight: 550; }
  .total { display: flex; justify-content: space-between; padding-top: 12px; margin-top: 4px; border-top: 2px solid var(--line-light); font-size: 15px; font-weight: 700; }
  .total .r { font-variant-numeric: tabular-nums; }

  .tl .ev { display: grid; grid-template-columns: 13px 1fr; gap: 12px; padding-bottom: 15px; position: relative; font-size: 13px; }
  .tl .ev:last-child { padding-bottom: 0; }
  .tl .ev:not(:last-child)::before { content: ""; position: absolute; left: 6px; top: 15px; bottom: 0; width: 1px; background: var(--line-light); }
  .tl .ev i { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); margin-top: 5px; display: block; }
  .tl .ev.past i { background: var(--line-dark); }
  .tl .ev.next i { background: var(--surface); border: 2px solid var(--line-light); width: 11px; height: 11px; margin-top: 4px; }
  .tl .ev b { display: block; color: var(--ink); font-weight: 600; }
  .tl .ev span { color: var(--muted); font-size: 12px; }

  /* =============== hàng đợi việc =============== */
  .work { display: grid; grid-template-columns: 248px 336px minmax(0, 1fr); flex: 1; min-height: 0; }
  @media (max-width: 1280px) { .work { grid-template-columns: 216px 300px minmax(0, 1fr); } }
  @media (max-width: 980px) { .work { grid-template-columns: 200px minmax(0, 1fr); } .work .qitems { display: none; } }
  @media (max-width: 720px) { .work { grid-template-columns: minmax(0, 1fr); } .work .qrail { display: none; } }
  .qrail { background: var(--surface); border-right: 1px solid var(--line-light); overflow-y: auto; padding: 12px 9px; }
  .qrail .cap { font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); padding: 4px 10px 8px; }
  .qb { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 9px 10px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .qb:hover { background: var(--primary-soft); color: var(--primary-dark); }
  .qb[aria-current="true"] { background: var(--primary); color: #fff; font-weight: 600; }
  .qb:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .qb .sq { width: 8px; height: 8px; border-radius: 2px; flex: none; }

/* Đăng ký một tab đóng góp vào trang đối tượng của module khác. */
function contributeTab(kind, tab) {
  if (!OBJECTS[kind]) return;
  OBJECTS[kind].tabs.push(tab);
  OBJECTS[kind].tabs.sort(function (a, b) { return a.order - b.order; });
}

/* Chỉ mục cho thanh lệnh: đối tượng + hành động + đi tới, gom từ mọi module. */
/* Bọc một mục hàng lệnh: giữ nguyên chỗ đứng, chỉ khoá lại và nói rõ lý do khi thiếu quyền.
   Không sửa item gốc (COMMANDS dùng chung) — luôn trả về bản sao. */
function palItem(perm, item) {
  var allowed = can(perm);
  var copy = { group: item.group, module: item.module, label: item.label, hint: item.hint, perm: perm, locked: !allowed };
  if (allowed) {
    copy.run = item.run;
  } else {
    copy.reason = permReason(perm);
    copy.run = function () { toast(copy.reason); };
  }
  return copy;
}
function commandIndex() {
  var out = [];
  MODULES.forEach(function (m) {
    out.push(palItem(m.perm, {
      group: 'Đi tới', module: m.id, label: m.label, hint: m.screen,
      run: function () { go(m.screen); }
    }));
  });
  Object.keys(DATASETS).forEach(function (screen) {
    var ds = DATASETS[screen];
    ds.rows.slice(0, 8).forEach(function (r) {
      out.push(palItem(ds.perm, {
        group: 'Đối tượng', module: ds.module, label: ds.search(r), hint: ds.search(r),
        run: function () { openObject(ds.module, ds.kind, r[ds.key]); }
      }));
    });
  });
  QUEUES.forEach(function (q) {
    q.items.forEach(function (it) {
      out.push(palItem(q.perm, {
        group: 'Việc cần làm', module: q.module, label: it.action + ' · ' + it.title, hint: it.sub,
        run: function () { S.queue = q.id; S.qIndex = q.items.indexOf(it); go('work'); }
      }));
    });
  });
  COMMANDS.forEach(function (c) { out.push(palItem(c.perm, c)); });
  var rank = { 'Việc cần làm': 0, 'Đối tượng': 1, 'Hành động': 2, 'Đi tới': 3 };
  return out.sort(function (a, b) { return rank[a.group] - rank[b.group]; });
}

function orderTimeline(o) {
  var order = ['DRAFT', 'CONFIRMED', 'PROCESSING', 'PICKING', 'PACKED', 'SHIPPED', 'COMPLETED'];
  var at = order.indexOf(o.st);
  if (o.st === 'CANCELLED') {
    return tlEvent('', 'Đã huỷ', o.at + ' · ' + (o.note || 'huỷ từ ' + o.ch)) + tlEvent('past', 'Tạo từ ' + o.ch, o.at);
  }
  if (o.st === 'CANCELLATION_PENDING') {
    return tlEvent('', 'Huỷ chưa xong ở kho', 'Phiếu PX-5849-03 tại KHO-HCM chưa huỷ được') +
      tlEvent('past', 'Đã huỷ phiếu KHO-HN', '10/08 20:02') + tlEvent('past', 'Yêu cầu huỷ đơn', '10/08 20:01');
  }
  var out = '';
  if (at < order.length - 1) out += tlEvent('next', ORDER_STATUS[order[at + 1]].label, 'bước kế tiếp');
  for (var i = at; i >= 0; i--) {
    out += tlEvent(i === at ? '' : 'past', ORDER_STATUS[order[i]].label, i === at ? 'hiện tại · ' + o.at : '');
  }

<script>
/* =========================================================================
   4g · SẮP XẾP THEO CỘT
   Chỉ cột nào khai `sk` mới sắp được — và chỉ cột đó mới đổi con trỏ chuột.
   Cột không khai thì không hứa gì cả (bảng Kênh bán cố ý để trống).
   ========================================================================= */

function rank(dict, key) { var ks = Object.keys(dict); var i = ks.indexOf(key); return i === -1 ? 999 : i; }

var SORT_KEYS = {
  orders: {
    'Mã đơn':     function (o) { return o.id; },
    'Khách hàng': function (o) { return o.cus; },
    'Kênh':       function (o) { return o.ch; },
    'Giá trị':    function (o) { return orderTotal(o); },
    'Thanh toán': function (o) { return rank(PAY_STATUS, o.pay); },
    'Trạng thái': function (o) { return rank(ORDER_STATUS, o.st); },
    'Tạo lúc':    function (o) { return o.at; }
  },
  products: {
    'SKU cha':      function (p) { return p.sku; },
    'Tên sản phẩm': function (p) { return p.name; },
    'Phân loại':    function (p) { return p.variants.length; },
    'Giá bán':      function (p) { return p.price[0]; },
    'Khả dụng':     function (p) { return p.avail; },
    'Dữ liệu':      function (p) { return p.ready; },
    'Trạng thái':   function (p) { return rank(PRODUCT_STATUS, p.st); }
  },
  stock: {
    'Mã SKU':   function (s) { return s.sku; },
    'Tên hàng': function (s) { return s.name; },
    'Vị trí':   function (s) { return s.loc; },
    'Khả dụng': function (s) { return avail(s); },
    'Đang giữ': function (s) { return s.reserved; },
    'Thực có':  function (s) { return s.onhand; }
  },
  invoices: {
    'Số hoá đơn':   function (i) { return i.no; },
    'Người mua':    function (i) { return i.buyer; },
    'Tổng tiền':    function (i) { return i.total; },
    'Cơ quan thuế': function (i) { return rank(TAX_STATE, i.tax); },
    'Nghiệp vụ':    function (i) { return rank(BIZ_STATE, i.biz); },
    'Lập lúc':      function (i) { return i.at; }
  }
};

Object.keys(SORT_KEYS).forEach(function (screen) {
  var ds = DATASETS[screen];
  if (!ds) return;
  ds.cols.forEach(function (c) {
    if (SORT_KEYS[screen][c.label]) c.sk = SORT_KEYS[screen][c.label];
  });
});

/* Mặc định của mỗi VIEW là câu trả lời đúng cho câu hỏi của view đó.
   Làm đúng chỗ này thì phần lớn người dùng không bao giờ phải bấm sort. */
var VIEW_SORT = {
  orders:   { todo: ['Tạo lúc', 1], unpaid: ['Giá trị', -1], ship: ['Tạo lúc', 1] },
  products: { gap: ['Dữ liệu', 1], unlisted: ['Tên sản phẩm', 1] },
  stock:    { low: ['Khả dụng', 1], reserved: ['Đang giữ', -1] },
  invoices: { rejected: ['Lập lúc', 1] }
};
Object.keys(VIEW_SORT).forEach(function (screen) {
  var ds = DATASETS[screen];
  if (!ds) return;
  ds.views.forEach(function (v) {
    var d = VIEW_SORT[screen][v.id];
    if (d) v.defSort = { label: d[0], dir: d[1] };
  });
});

/* Ba nhịp: tăng → giảm → về mặc định của view. Nhịp thứ ba luôn cần và hay bị quên. */
function sortState(screen) {
  var s = S.sort[screen];
  if (s) return s;
  var v = currentView(screen);
  return v && v.defSort ? { label: v.defSort.label, dir: v.defSort.dir, auto: true } : null;
}
function cycleSort(screen, label) {
  var s = S.sort[screen];
  if (!s || s.label !== label) S.sort[screen] = { label: label, dir: 1 };
  else if (s.dir === 1) S.sort[screen] = { label: label, dir: -1 };
  else S.sort[screen] = null;
}
function applySort(screen, rows) {
  var st = sortState(screen);
  if (!st) return rows;
  var ds = DATASETS[screen];
  var col = ds.cols.filter(function (c) { return c.label === st.label; })[0];
  if (!col || !col.sk) return rows;
  return rows.slice().sort(function (a, b) {
    var x = col.sk(a), y = col.sk(b);
    /* Không rõ luôn xuống cuối, bất kể chiều — xem Luật 12. */
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    if (typeof x === 'string') return x.localeCompare(y, 'vi') * st.dir;
    return (x < y ? -1 : x > y ? 1 : 0) * st.dir;
  });
}
</script>

<script>
/* =========================================================================
   5 · MÀN HÌNH — năm loại trang, dùng chung một bộ khuôn
   ========================================================================= */

/* ---------------- truy vấn dữ liệu ---------------- */
function currentView(screen) {
  var ds = DATASETS[screen];
  var id = S.view[screen] || ds.views[0].id;
  return ds.views.filter(function (v) { return v.id === id; })[0] || ds.views[0];
}
function filteredRows(screen) {
  var ds = DATASETS[screen];
  if (!ds) return [];
  var v = currentView(screen);
  var q = (S.query[screen] || '').trim().toLowerCase();
  var rows = ds.rows.filter(v.f).filter(function (r) {
    if (!q) return true;
    return ds.search(r).toLowerCase().indexOf(q) !== -1;
  });
  return applySort(screen, rows);
}
function currentRow(screen) {
  var rows = filteredRows(screen);
  if (!rows.length) return null;
  var i = Math.min(S.cursor[screen] || 0, rows.length - 1);
  return rows[i];
}
function markedRows(screen) {
  var ds = DATASETS[screen];
  var m = S.marked[screen] || {};
  return ds.rows.filter(function (r) { return m[r[ds.key]]; });
}
function rowById(kind, id) {
  var found = null;
  Object.keys(DATASETS).forEach(function (k) {
    var ds = DATASETS[k];
    if (ds.kind !== kind) return;
    ds.rows.forEach(function (r) { if (String(r[ds.key]) === String(id)) found = r; });
  });
  return found;
}
function moduleBadge(moduleId) {
  var n = 0, hot = false;
  QUEUES.forEach(function (q) {
    if (q.module !== moduleId) return;
    n += q.items.length;
    if (q.items.some(function (i) { return i.urgent; })) hot = true;
  });
  return n ? { n: n, hot: hot } : null;
}
function totalQueueCount() {
  return QUEUES.filter(function (q) { return can(q.perm); })
    .reduce(function (a, q) { return a + q.items.length; }, 0);
}

/* =========================================================================
   Trang 1 · VIỆC CỦA TÔI
   ========================================================================= */
function visibleQueues() { return QUEUES; }
function allowedQueues() { return QUEUES.filter(function (q) { return can(q.perm); }); }
function currentQueue() {
  var qs = allowedQueues();
  if (!qs.length) return null;
  var q = qs.filter(function (x) { return x.id === S.queue; })[0];
  if (!q) { q = qs.filter(function (x) { return x.items.length; })[0] || qs[0]; S.queue = q.id; }
  return q;
}
function queueItems() { var q = currentQueue(); return q ? q.items : []; }

SCREENS.work = function () {
  var qs = visibleQueues();
  var q = currentQueue();
  var items = q ? q.items : [];
  if (S.qIndex >= items.length) S.qIndex = Math.max(0, items.length - 1);
  var it = items[S.qIndex];
  var totalLeft = totalQueueCount();

  var rail = '<div class="cap">Việc của tôi · ' + seller().name + '</div>';
  qs.forEach(function (x) {
    var allowed = can(x.perm);
    var hot = allowed && x.items.some(function (i) { return i.urgent; });
    rail += '<button class="qb ' + (x.items.length ? '' : 'done') + '" type="button" data-queue="' + x.id + '"' +
      ' aria-current="' + (q && x.id === q.id) + '"' +
      (allowed ? '' : ' disabled aria-disabled="true" title="' + esc(permReason(x.perm)) + '"') + '>' +
      '<span class="sq" style="background:' + x.color + '"></span><span>' + x.label + '</span>' +
      '<span class="n ' + (hot ? 'hot' : '') + '">' + x.items.length + '</span></button>';
  });

  var done = S.qDone;
  var total = items.length + done;
  var list = '<div class="qhead"><h2>' + (q ? q.label : 'Việc của tôi') + '</h2>' +
    '<div class="meta">' + (items.length ? 'Còn ' + items.length + ' việc' : 'Đã xong nhóm này') +
    ' · đã xử lý ' + done + ' hôm nay</div>' +
    '<div class="qbar"><i style="width:' + (total ? Math.round(done / total * 100) : 100) + '%"></i></div></div>';
  if (!items.length) {
    list += '<div class="empty"><div class="ttl">Sạch hàng đợi</div><p>Không còn việc nào trong nhóm này.</p></div>';
  } else {
    items.forEach(function (x, i) {
      list += '<button class="qitem ' + (x.urgent ? 'urgent' : '') + '" type="button" data-qitem="' + i + '"' +
        ' aria-current="' + (i === S.qIndex) + '">' +
        '<div class="t1">' + x.title + '</div><div class="t2">' + x.sub + '</div>' +
        '<div class="t3"><span>' + q.module + '</span><span class="age">' + x.age + '</span></div></button>';
    });
  }

  var pane;
  if (!it) {
    var nextQ = qs.filter(function (x) { return x.items.length; })[0];
    pane = '<div class="empty" style="padding-top:80px"><div class="ttl">' +
      (totalLeft ? 'Xong nhóm này' : 'Hết việc hôm nay') + '</div>' +
      '<p>' + (totalLeft ? 'Còn ' + totalLeft + ' việc ở nhóm khác.' : 'Không còn việc nào đang chờ bạn ở gian hàng ' + seller().name + '.') + '</p>' +
      (nextQ ? '<button class="btn btn-md btn-primary" type="button" data-queue="' + nextQ.id + '">Sang ' + nextQ.label.toLowerCase() + '</button>' : '') +
      '</div>';
  } else {
    pane =
      '<div class="whead"><h1>' + it.title + '</h1>' +
      '<div class="sub">' + it.sub + ' · chờ ' + it.age + ' · việc ' + (S.qIndex + 1) + '/' + items.length + '</div></div>' +
      '<div class="why">' + it.why + '</div>' +
      '<div class="grid2"><div>' +
        '<div class="card"><h3>Dữ kiện để quyết</h3>' + dl(it.facts) + '</div>' +
        (it.lines ? '<div class="card"><h3>' + (it.linesTitle || 'Chi tiết') + '</h3>' +
          it.lines.map(function (l) { return lrow(l[0], l[1]); }).join('') + '</div>' : '') +
      '</div><div>' +
        '<div class="card"><h3>Liên quan</h3>' +
          (it.links || []).map(function (l) {
            return '<div class="lrow"><span class="l">' + l.label + '</span>' +
              '<button class="lnk" type="button" data-open="' + l.module + '|' + l.kind + '|' + l.id + '">' + l.id + '</button></div>';
          }).join('') +
        '</div>' +
        (it.timeline ? '<div class="card"><h3>Dòng thời gian</h3><div class="tl">' +
          it.timeline.map(function (t) { return tlEvent(t[0], t[1], t[2]); }).join('') + '</div></div>' : '') +
      '</div></div>' +
      '<div class="actionbar">' +
        '<button class="btn btn-md btn-primary" type="button" data-do="primary">' + it.action + '<kbd>E</kbd></button>' +
        (it.action2 ? '<button class="btn btn-sm btn-cancel" type="button" data-do="alt">' + it.action2 + '</button>' : '') +
        '<button class="btn btn-sm btn-cancel" type="button" data-do="later">Để sau<kbd>X</kbd></button>' +
        '<span class="hint"><span class="kbd">J</span><span class="kbd">K</span> đổi việc · xong là tự sang việc kế tiếp</span>' +
      '</div>';
  }

  return '<div class="work">' +
    '<div class="qrail">' + rail + '</div>' +
    '<div class="qitems">' + list + '</div>' +
    '<div class="workpane">' + pane + '</div>' +
    '</div>';
};

function doQueueAction(which) {
  var q = currentQueue();
  if (!q || !q.items.length) return;
  var it = q.items[S.qIndex];
  if (which === 'later') {
    S.qIndex = (S.qIndex + 1) % q.items.length;
    render();
    toast('Để sau — việc vẫn nằm trong hàng đợi.');
    return;
  }
  var label = which === 'alt' ? it.action2 : it.action;
  var finish = function () {
    q.items.splice(S.qIndex, 1);
    S.qDone++;
    if (S.qIndex >= q.items.length) S.qIndex = Math.max(0, q.items.length - 1);
    render();
    toast(label + ' — ' + it.title + '.', it.irreversible ? null : 'Hoàn tác');
  };
  if (which !== 'alt' && it.irreversible) {
    confirmModal(label + '?', it.confirm || 'Việc này gửi dữ liệu ra ngoài hệ thống và không hoàn tác được.', label, finish);
  } else {
    finish();
  }
}

/* =========================================================================
   Trang 2 · DANH SÁCH (bàn dữ liệu hai khung)
   ========================================================================= */
function dataScreen(screen) {
  var ds = DATASETS[screen];
  var rows = filteredRows(screen);
  var cur = Math.min(S.cursor[screen] || 0, Math.max(0, rows.length - 1));
  var marks = S.marked[screen] || {};
  var nMarked = Object.keys(marks).filter(function (k) { return marks[k]; }).length;

  /* Băng 1: đường dẫn · tên trang · view tab · hành động — cùng một dòng.
     Băng 2: tìm · lọc · đếm. Bốn băng cũ gộp còn hai, bảng bắt đầu cao hơn ~70px. */
  var head =
    '<div class="phead">' +
      '<span class="crumb">' + ds.group + '</span>' +
      '<h1>' + ds.title + '</h1>' +
      '<span class="sep"></span>' +
      '<div class="viewtabs">' +
        ds.views.map(function (v) {
          return '<button class="viewtab" type="button" data-view="' + v.id + '" aria-pressed="' +
            (currentView(screen).id === v.id) + '">' + v.label + '<span class="n">' + ds.rows.filter(v.f).length + '</span></button>';
        }).join('') +
        '<button class="viewtab ghost" type="button" data-toast="Đã lưu view. Mọi bộ lọc nằm trên URL nên gửi liên kết là gửi cả câu hỏi.">+ Lưu view</button>' +
      '</div>' +
      '<div class="acts">' + (ds.headActions || '') + '</div>' +
    '</div>' +
    '<div class="filterbar">' +
      '<div class="searchbox"><span aria-hidden="true" style="color:var(--muted)">⌕</span>' +
      '<input id="listsearch" value="' + esc(S.query[screen] || '') + '" placeholder="' + ds.searchHint + '" aria-label="Tìm trong ' + ds.title + '"></div>' +
      (ds.filters || []).map(function (f) { return '<button class="fbtn' + (f.on ? ' on' : '') + '" type="button" data-toast="' + esc(f.toast || 'Bộ lọc ' + f.label) + '">' + f.label + '</button>'; }).join('') +
      '<span class="count">' + rows.length + ' / ' + ds.rows.length + ' dòng</span>' +
    '</div>';

  var table;
  if (!rows.length) {
    table = '<div class="empty"><div class="ttl">' + ds.emptyTitle + '</div><p>' + ds.emptyBody + '</p>' +
      (ds.emptyAction || '') + '</div>';
  } else {
    var st = sortState(screen);
    var nOn = rows.filter(function (r) { return marks[r[ds.key]]; }).length;
    var allCls = nOn === 0 ? '' : (nOn === rows.length ? 'on' : 'some');
    var allSym = allCls === 'some' ? '–' : '✓';
    table = '<div class="tablewrap"><table><thead><tr>' +
      '<th class="pick"><span class="tick head ' + allCls + '" data-all="1" role="checkbox"' +
        ' aria-checked="' + (allCls === 'on' ? 'true' : allCls === 'some' ? 'mixed' : 'false') + '"' +
        ' title="Chọn tất cả ' + rows.length + ' dòng đang lọc">' + allSym + '</span></th>' +
      ds.cols.map(function (c) {
        var on = st && st.label === c.label;
        return '<th class="' + (c.num ? 'num ' : '') + (c.sk ? 'sortable ' : '') + (on ? 'sorted' : '') + '"' +
          (c.sk ? ' data-sort="' + esc(c.label) + '"' : '') + '>' + c.label +
          (on ? '<span class="ar">' + (st.dir === 1 ? '▲' : '▼') + '</span>' : '') + '</th>';
      }).join('') +
      '</tr></thead><tbody>' +
      rows.map(function (r, i) {
        var id = r[ds.key];
        return '<tr data-row="' + i + '" class="' + (i === cur ? 'cur' : '') + ' ' + (marks[id] ? 'marked' : '') + '">' +
          '<td><span class="tick ' + (marks[id] ? 'on' : '') + '" data-tick="' + id + '">✓</span></td>' +
          ds.cols.map(function (c) {
            return '<td class="' + (c.num ? 'num ' : '') + (c.mono ? 'mono' : '') + '">' + c.cell(r) + '</td>';
          }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  /* Hành động trên tập không nhìn thấy hết phải xác nhận có nêu cả số lẫn bộ lọc đang áp. */
  var vlabel = currentView(screen).label;
  var allSel = nMarked && nMarked === rows.length;
  var bulk = nMarked ? '<div class="bulk"><b>' + nMarked + '</b> dòng đang chọn' +
    (allSel ? ' · toàn bộ kết quả của view “' + vlabel + '”' : '') +
    (ds.bulkActions || []).map(function (b) {
      return '<button type="button" data-toast="' + esc(b.label + ' · ' + nMarked + ' dòng đang lọc theo “' + vlabel + '”. ' + b.toast) + '">' + b.label + '</button>';
    }).join('') + '</div>' : '';

  return head + '<div class="split"><div style="display:flex;flex-direction:column;min-height:0;position:relative">' +
    table + bulk + '</div>' + peekPane(screen, rows[cur]) + '</div>';
}

function peekPane(screen, row) {
  var ds = DATASETS[screen];
  var pins = '<div class="pinbar">' +
    (S.pins.length
      ? S.pins.map(function (p, i) {
          return '<button class="pin" type="button" data-gopin="' + i + '">' + p.id +
            '<span class="x" data-unpin="' + i + '">×</span></button>';
        }).join('')
      : '<span class="empty">Chưa ghim gì · nhấn P để ghim và đối chiếu</span>') +
    '</div>';

  if (!row) {
    return '<aside class="peek">' + pins +
      '<div class="empty"><div class="ttl">Chưa chọn dòng nào</div><p>Bấm một dòng hoặc dùng phím ↑ ↓.</p></div></aside>';
  }

  var obj = OBJECTS[ds.kind];
  var tabs = obj.tabs;
  var allowedTabs = tabs.filter(function (t) { return can(t.perm); });
  if (!allowedTabs.some(function (t) { return t.id === S.peekTab; })) S.peekTab = (allowedTabs[0] || tabs[0]).id;
  var pinned = S.pins.some(function (p) { return String(p.id) === String(row[ds.key]); });

  return '<aside class="peek">' + pins +
    '<div class="otabs">' + tabs.map(function (t) {
      var allowed = can(t.perm);
      return '<button class="otab" type="button" data-peektab="' + t.id + '" aria-selected="' + (S.peekTab === t.id) + '"' +
        (allowed ? '' : ' disabled aria-disabled="true" title="' + esc(permReason(t.perm)) + '"') + '>' +
        '<span>' + t.label + '</span><span class="src">' + t.by + '</span></button>';
    }).join('') + '</div>' +
    '<div class="peekbody">' +
      '<h2>' + obj.title(row) + '</h2>' +
      '<div class="psub">' + obj.sub(row) + '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">' + obj.chips(row) + '</div>' +
      obj.panel(S.peekTab, row, true) +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">' +
        obj.actions(row) +
        '<button class="btn btn-sm btn-cancel" type="button" data-pin="1">' + (pinned ? 'Bỏ ghim' : 'Ghim') + '</button>' +
        '<button class="btn btn-sm btn-cancel" type="button" data-open="' + ds.module + '|' + ds.kind + '|' + row[ds.key] + '">Mở trang đầy đủ</button>' +
      '</div>' +
    '</div></aside>';
}

/* =========================================================================
   Trang 3 · ĐỐI TƯỢNG (trang đầy đủ)
   ========================================================================= */
SCREENS.object = function () {
  var o = S.obj;
  var row = rowById(o.kind, o.id);
  var obj = OBJECTS[o.kind];
  if (!row) {
    return '<div class="scrollarea"><div class="empty"><div class="ttl">Không tìm thấy</div>' +
      '<p>Đối tượng ' + o.id + ' không còn tồn tại hoặc không thuộc gian hàng ' + seller().name + '.</p></div></div>';
  }
  var tabs = obj.tabs;
  var allowedTabs = tabs.filter(function (t) { return can(t.perm); });
  if (!allowedTabs.some(function (t) { return t.id === o.tab; })) o.tab = (allowedTabs[0] || tabs[0]).id;
  var m = MODULES.filter(function (x) { return x.id === o.module; })[0];
  var pinned = S.pins.some(function (p) { return String(p.id) === String(o.id); });

  return '<div class="phead">' +
      '<div class="crumbs"><button class="lnk" type="button" data-go="' + m.screen + '">' + m.label + '</button>' +
      '<span>·</span><span>' + o.id + '</span></div>' +
      '<div class="ptitle"><div><h1>' + obj.title(row) + '</h1><div class="sub">' + obj.sub(row) + '</div></div>' +
      '<div class="acts">' + obj.actions(row) +
      '<button class="btn btn-sm btn-cancel" type="button" data-pin="1">' + (pinned ? 'Bỏ ghim' : 'Ghim') + '</button></div></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 10px">' + obj.chips(row) + '</div>' +
    '</div>' +
    '<div class="otabs" style="padding:0 22px">' + tabs.map(function (t) {
      var allowed = can(t.perm);
      return '<button class="otab" type="button" data-tab="' + t.id + '" aria-selected="' + (o.tab === t.id) + '"' +
        (allowed ? '' : ' disabled aria-disabled="true" title="' + esc(permReason(t.perm)) + '"') + '>' +
        '<span>' + t.label + '</span><span class="src">' + t.by + '</span></button>';
    }).join('') + '</div>' +
    '<div class="scrollarea">' + obj.panel(o.tab, row, false) + '</div>';
};

/* =========================================================================
   Trang 4 · MÁY QUÉT
   ========================================================================= */
SCREENS.scan = function () {
  if (!S.scanTask) {
    return '<div class="scanwrap"><div class="scan">' +
      '<div class="scanhead"><h1>Máy quét</h1></div>' +
      '<p style="color:var(--muted);font-size:13.5px;margin:0 0 18px">Chọn việc cần làm. Màn quét dùng mật độ lớn, không có menu bên, và phím Enter luôn là gửi.</p>' +
      SCAN_TASKS.map(function (t) {
        return '<button class="radio" type="button" data-scan="' + t.id + '" aria-checked="false" style="width:100%;text-align:left">' +
          '<span class="dot"></span><span class="txt"><b>' + t.label + '</b><span>' + t.sub + '</span></span>' +
          '<span class="chip chip-neutral sm" style="margin-left:auto">' + t.count + '</span></button>';
      }).join('') +
      '</div></div>';
  }
  var t = SCAN_TASKS.filter(function (x) { return x.id === S.scanTask; })[0];
  var step = t.steps[Math.min(S.scanStep, t.steps.length - 1)];
  return '<div class="scanwrap"><div class="scan">' +
    '<div class="scanhead"><h1>' + t.label + '</h1>' +
      '<button class="btn btn-sm btn-cancel" type="button" data-go="scan">Thoát</button></div>' +
    '<div class="scanstep">' + t.steps.map(function (s, i) {
      return '<div class="' + (i < S.scanStep ? 'ok' : (i === S.scanStep ? 'on' : '')) + '"></div>';
    }).join('') + '</div>' +
    '<div class="scanbig"><div class="lbl">' + step.context + '</div><div class="val">' + step.big + '</div></div>' +
    (step.field
      ? '<div class="scanfield' + (S.scanErr ? ' err' : '') + '"><div class="cap">' +
        (S.scanErr ? S.scanErr : step.field) + '</div>' +
        '<input id="scaninput" inputmode="none" autocomplete="off" aria-label="' + step.field + '" placeholder="' + step.placeholder + '"></div>'
      : '') +
    (step.list ? '<div class="scanbig scanlist">' + step.list.map(function (l) {
      return '<div class="r ' + (l[2] ? 'done' : '') + '"><span>' + l[0] + '</span><b>' + l[1] + '</b></div>';
    }).join('') + '</div>' : '') +
    '<div style="display:flex;gap:10px;margin-top:6px">' +
      '<button class="btn btn-md btn-primary" type="button" data-scanstep="1" style="flex:1">' + step.action + '</button>' +
      (step.alt ? '<button class="btn btn-md btn-cancel" type="button" data-toast="' + esc(step.altToast || step.alt) + '">' + step.alt + '</button>' : '') +
    '</div>' +
    '<p style="color:var(--muted);font-size:12.5px;margin-top:14px;text-align:center">Máy quét phát Enter để gửi. Ô quét luôn giữ con trỏ.</p>' +
    '</div></div>';
};

function startScanTask(id) { S.scanTask = id; S.scanStep = 0; S.scanErr = null; render(); }
function scanAdvance() {
  var t = SCAN_TASKS.filter(function (x) { return x.id === S.scanTask; })[0];
  S.scanErr = null;
  if (S.scanStep < t.steps.length - 1) { S.scanStep++; render(); }
  else { toast(t.doneToast); S.scanTask = null; S.scanStep = 0; render(); }
}
function scanSubmit(value) {
  var t = SCAN_TASKS.filter(function (x) { return x.id === S.scanTask; })[0];
  var step = t.steps[S.scanStep];
  if (step.expect && value && value.trim() && value.trim().toUpperCase().indexOf(step.expect) === -1) {
    S.scanErr = 'Sai mã — cần ' + step.expect + ', vừa quét ' + esc(value.trim());
    render();
    return;
  }
  scanAdvance();
}

/* =========================================================================
   Trang 5 · CẤU HÌNH và 403
   ========================================================================= */
SCREENS.settings = function () {
  return '<div class="phead"><div class="crumbs"><span>Hệ thống</span><span>·</span><span>Cấu hình</span></div>' +
    '<div class="ptitle"><div><h1>Cấu hình</h1><div class="sub">' + seller().name + '</div></div></div></div>' +
    '<div class="scrollarea"><div class="grid3">' +
    SETTINGS_GROUPS.map(function (g) {
      return '<div class="card"><h3>' + g.by + '</h3>' +
        '<div style="font-size:15px;font-weight:700;margin-bottom:4px">' + g.label + '</div>' +
        '<div style="font-size:13px;color:var(--ink-2);margin-bottom:12px">' + g.desc + '</div>' +
        (g.scope ? '<div style="margin-bottom:12px">' + chip(g.scopeKind, g.scope) + '</div>' : '') +
        '<button class="btn btn-sm btn-secondary" type="button" data-toast="' + esc(g.toast) + '">Mở</button></div>';
    }).join('') + '</div></div>';
};

SCREENS.denied = function () {
  var m = S.deniedFor || { label: 'màn hình này', perm: '' };
  return '<div class="scrollarea"><div class="deny">' +
    '<div class="code">403 · thiếu quyền</div>' +
    '<h2>Tài khoản của bạn không mở được ' + m.label.toLowerCase() + '</h2>' +
    '<p>Màn hình này cần quyền <code>' + m.perm + '</code>. Vai trò <code>' + S.role + '</code> hiện có: <code>' +
    ROLES[S.role].perms.join(' ') + '</code>.</p>' +
    '<p style="color:var(--muted)">Phiên đăng nhập của bạn vẫn còn. Nếu bạn cần quyền này để làm việc, hãy đề nghị quản trị viên của gian hàng cấp thêm.</p>' +
    '<button class="btn btn-sm btn-secondary" type="button" data-go="work">Về Việc của tôi</button>' +
    '</div></div>';
};
</script>

<script>
/* Mọi màn danh sách dùng chung một khuôn bàn dữ liệu. */
Object.keys(DATASETS).forEach(function (screen) {
  SCREENS[screen] = function () { return dataScreen(screen); };
});
</script>

<script>
/* =========================================================================
   6 · CHẠY MÁY — điều hướng, thanh lệnh, lớp phủ, bàn phím
   ========================================================================= */

/* ---------------- sidebar ---------------- */
function renderSidebar() {
  var h = '';
  var work = MODULES.filter(function (m) { return m.id === 'work'; })[0];
  var qTotal = totalQueueCount();
  h += '<button class="navb" type="button" data-go="work" ' + (S.screen === 'work' ? 'aria-current="page"' : '') + '>' +
    svgIcon(work.icon) + '<span class="lbl">' + work.label + '</span>' +
    (qTotal ? '<span class="badge hot lbl">' + qTotal + '</span>' : '') + '</button>';

  GROUPS.forEach(function (g) {
    var items = MODULES.filter(function (m) { return m.group === g; });
    if (!items.length) return;
    h += '<div class="grp">' + g + '</div>';
    items.sort(function (a, b) { return a.order - b.order; }).forEach(function (m) {
      var allowed = can(m.perm);
      var active = allowed && (S.screen === m.screen || (S.screen === 'object' && S.obj && S.obj.module === m.id));
      var badge = allowed ? moduleBadge(m.id) : null;
      h += '<button class="navb" type="button" data-go="' + m.screen + '"' + (active ? ' aria-current="page"' : '') +
        (allowed ? '' : ' disabled aria-disabled="true" title="' + esc(permReason(m.perm)) + '"') + '>' +
        svgIcon(m.icon) + '<span class="lbl">' + m.label + '</span>' +
        (badge ? '<span class="badge ' + (badge.hot ? 'hot' : '') + ' lbl">' + badge.n + '</span>' : '') + '</button>';
    });
  });
  el('sidebar').innerHTML = h;
  each(el('sidebar'), '[data-go]', function (b) {
    b.onclick = function () { go(b.dataset.go); };
  });
}

function go(screen) {
  var m = moduleOf(screen);
  if (m && !can(m.perm)) { S.screen = 'denied'; S.deniedFor = m; render(); return; }
  S.screen = screen;
  S.obj = null;
  if (screen === 'scan') { S.scanTask = null; S.scanStep = 0; S.scanPicked = []; }
  render();
}

function openObject(module, kind, id, tab) {
  S.obj = { module: module, kind: kind, id: id, tab: tab || 'sum' };
  S.screen = 'object';
  render();
}

/* ---------------- thanh dưới ---------------- */
function renderStatusbar() {
  var bar = el('statusbar');
  var ds = DATASETS[S.screen];
  if (!ds) {
    bar.innerHTML = '<span>' + seller().name + ' · ' + seller().note + '</span>' +
      '<span class="keys"><span class="kbd">Ctrl K</span> thanh lệnh</span>';
    return;
  }
  var rows = filteredRows(S.screen);
  var marks = markedRows(S.screen);
  var agg = '';
  if (marks.length) {
    var t = marks.reduce(function (a, r) { return a + (ds.sum ? ds.sum(r) : 0); }, 0);
    agg = '<span class="agg">' + marks.length + ' dòng chọn' + (ds.sum ? ' · ' + (ds.sumFmt ? ds.sumFmt(t) : vnd(t)) : '') + '</span>';
  }
  bar.innerHTML = '<span><b>' + rows.length + '</b> / ' + ds.rows.length + ' dòng</span>' + agg +
    '<span class="keys"><span class="kbd">↑</span><span class="kbd">↓</span> di chuyển' +
    '<span class="kbd">Space</span> chọn<span class="kbd">P</span> ghim<span class="kbd">Enter</span> mở' +
    '<span class="kbd">Ctrl K</span> lệnh</span>';
}

/* ---------------- vẽ toàn bộ ---------------- */
function render() {
  document.documentElement.setAttribute('data-density', S.density);
  el('sellername').textContent = seller().name;
  el('whoname').textContent = ROLES[S.role].name;
  el('whorole').textContent = S.role;
  el('whorole').className = 'rolebadge r' + ROLES[S.role].rank;
  el('whoav').textContent = ROLES[S.role].name.charAt(0);
  el('body').className = 'body' + (S.screen === 'scan' && S.scanTask ? ' scan' : '');
  renderSidebar();
  var fn = SCREENS[S.screen] || SCREENS.work;
  el('canvas').innerHTML = fn();
  renderStatusbar();
  bindCanvas();
}

/* ---------------- ràng buộc sự kiện trong canvas ---------------- */
function bindCanvas() {
  var c = el('canvas');
  each(c, '[data-go]', function (b) { b.onclick = function () { go(b.dataset.go); }; });
  each(c, '[data-view]', function (b) {
    b.onclick = function () { S.view[S.screen] = b.dataset.view; S.cursor[S.screen] = 0; S.marked[S.screen] = {}; render(); };
  });
  each(c, '[data-all]', function (b) {
    b.onclick = function () {
      var ds = DATASETS[S.screen], rows = filteredRows(S.screen);
      var m = S.marked[S.screen] || (S.marked[S.screen] = {});
      var nOn = rows.filter(function (r) { return m[r[ds.key]]; }).length;
      var turnOn = nOn < rows.length;   /* chọn một phần thì bấm là chọn hết, không phải bỏ hết */
      rows.forEach(function (r) { m[r[ds.key]] = turnOn; });
      render();
    };
  });
  each(c, '[data-sort]', function (th) {
    th.onclick = function () { cycleSort(S.screen, th.dataset.sort); S.cursor[S.screen] = 0; render(); };
  });
  each(c, '[data-row]', function (tr) {
    tr.onclick = function (e) {
      if (e.target.dataset && e.target.dataset.tick !== undefined) {
        toggleMark(S.screen, e.target.dataset.tick); render(); return;
      }
      S.cursor[S.screen] = +tr.dataset.row; S.peekTab = 'sum'; render();
    };
    tr.ondblclick = function () {
      var ds = DATASETS[S.screen], r = filteredRows(S.screen)[+tr.dataset.row];
      if (ds && r) openObject(ds.module, ds.kind, r[ds.key]);
    };
  });
  each(c, '[data-open]', function (b) {
    b.onclick = function (e) {
      e.stopPropagation();
      var p = b.dataset.open.split('|');
      openObject(p[0], p[1], p[2], p[3]);
    };
  });
  each(c, '[data-tab]', function (b) {
    b.onclick = function () { if (S.obj) S.obj.tab = b.dataset.tab; render(); };
  });
  each(c, '[data-peektab]', function (b) { b.onclick = function () { S.peekTab = b.dataset.peektab; render(); }; });
  each(c, '[data-pin]', function (b) { b.onclick = function () { togglePin(); render(); }; });
  each(c, '[data-unpin]', function (b) {
    b.onclick = function (e) { e.stopPropagation(); S.pins.splice(+b.dataset.unpin, 1); render(); };
  });
  each(c, '[data-gopin]', function (b) {
    b.onclick = function () { var p = S.pins[+b.dataset.gopin]; openObject(p.module, p.kind, p.id); };
  });
  each(c, '[data-queue]', function (b) {
    b.onclick = function () { S.queue = b.dataset.queue; S.qIndex = 0; render(); };
  });
  each(c, '[data-qitem]', function (b) { b.onclick = function () { S.qIndex = +b.dataset.qitem; render(); }; });
  each(c, '[data-do]', function (b) { b.onclick = function () { doQueueAction(b.dataset.do); }; });
  each(c, '[data-toast]', function (b) { b.onclick = function () { toast(b.dataset.toast); }; });
  each(c, '[data-confirm]', function (b) {
    b.onclick = function () {
      var p = b.dataset.confirm.split('|');
      confirmModal(p[0], p[1], p[2], function () { toast(p[3] || p[0]); });
    };
  });
  each(c, '[data-scan]', function (b) { b.onclick = function () { startScanTask(b.dataset.scan); }; });
  each(c, '[data-scanstep]', function (b) { b.onclick = function () { scanAdvance(); }; });
  each(c, '[data-drawer]', function (b) { b.onclick = function () { openDrawer(b.dataset.drawer); }; });

  var q = el('listsearch');
  if (q) {
    q.oninput = function () {
      var pos = q.selectionStart;
      S.query[S.screen] = q.value;
      S.cursor[S.screen] = 0;
      render();
      var n = el('listsearch');
      if (n) { n.focus(); n.setSelectionRange(pos, pos); }
    };
  }
  var sf = el('scaninput');
  if (sf) {
    sf.focus();
    sf.onkeydown = function (e) {
      if (e.key === 'Enter') { e.preventDefault(); scanSubmit(sf.value); }
    };
  }
}

function toggleMark(screen, id) {
  if (!S.marked[screen]) S.marked[screen] = {};
  S.marked[screen][id] = !S.marked[screen][id];
}
function togglePin() {
  var ds = DATASETS[S.screen];
  var r = currentRow(S.screen);
  if (S.obj) { r = { }; }
  var id, module, kind;
  if (S.obj) { id = S.obj.id; module = S.obj.module; kind = S.obj.kind; }
  else if (ds && r) { id = r[ds.key]; module = ds.module; kind = ds.kind; }
  else return;
  var at = -1;
  S.pins.forEach(function (p, i) { if (p.id === id) at = i; });
  if (at >= 0) S.pins.splice(at, 1);
  else S.pins.push({ id: id, module: module, kind: kind });
}

/* ---------------- toast ---------------- */
var toastTimer;
function toast(msg, undoLabel) {
  var t = el('toast');
  t.innerHTML = '<span>' + msg + '</span>' + (undoLabel ? '<button type="button" id="undobtn">' + undoLabel + '</button>' : '');
  t.classList.add('on');
  if (undoLabel) el('undobtn').onclick = function () { t.classList.remove('on'); toast('Đã hoàn tác.'); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('on'); }, 4200);
}

/* ---------------- modal ---------------- */
var modalOK = null;
function confirmModal(title, body, okLabel, onOk) {
  el('modaltitle').textContent = title;
  el('modalbody').innerHTML = body;
  el('modalacts').innerHTML = '<button class="btn btn-sm btn-cancel" id="mcancel" type="button">Để sau</button>' +
    '<button class="btn btn-sm btn-primary" id="mok" type="button">' + okLabel + '</button>';
  modalOK = onOk;
  el('modalscrim').classList.add('open');
  el('mcancel').onclick = closeModal;
  el('mok').onclick = function () { closeModal(); if (modalOK) modalOK(); };
}
function closeModal() { el('modalscrim').classList.remove('open'); modalOK = null; }
el('modalscrim').onclick = function (e) { if (e.target === el('modalscrim')) closeModal(); };

/* ---------------- drawer ---------------- */
function openDrawer(kind) {
  var d = DRAWERS[kind];
  if (!d) return;
  el('drawertitle').textContent = d.title;
  el('drawerbody').innerHTML = d.body();
  el('draweracts').innerHTML = d.acts || '<button class="btn btn-sm btn-cancel" type="button" id="dclose2">Đóng</button>';
  el('drawer').classList.add('open');
  el('drawerscrim').classList.add('open');
  if (d.bind) d.bind();
  var c2 = el('dclose2');
  if (c2) c2.onclick = closeDrawer;
}
function closeDrawer() { el('drawer').classList.remove('open'); el('drawerscrim').classList.remove('open'); }
el('drawerx').onclick = closeDrawer;
el('drawerscrim').onclick = closeDrawer;

/* =========================================================================
   BẢNG CHỌN NEO TẠI CHỖ
   Luật 10: bảng chọn mở ra từ chính nút đã bấm. Luật 11: drawer dành cho
   nội dung phải đọc hoặc form phải điền — chọn một giá trị thì luôn là đây.
   ========================================================================= */
function openMenu(anchor, html, align) {
  var m = el('menu');
  m.innerHTML = html;
  m.classList.add('open');
  el('menuscrim').classList.add('open');
  var r = anchor.getBoundingClientRect();
  var w = m.offsetWidth;
  var left = align === 'right' ? r.right - w : r.left;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  m.style.left = left + 'px';
  m.style.top = (r.bottom + 6) + 'px';
  var first = m.querySelector('.mi');
  if (first) first.focus();
}
function closeMenu() { el('menu').classList.remove('open'); el('menuscrim').classList.remove('open'); }
el('menuscrim').onclick = closeMenu;

/* ---------------- chọn gian hàng ---------------- */
el('sellerbtn').onclick = function () {
  var h = '<div class="mcap">Gian hàng</div>';
  SELLERS.forEach(function (x) {
    h += '<button class="mi" type="button" data-seller="' + x.id + '" aria-current="' + (x.id === S.seller) + '">' +
      '<span><b>' + x.name + '</b><span class="t2">' + x.note + '</span></span>' +
      (x.id === S.seller ? '<span class="ck">✓</span>' : '') + '</button>';
  });
  /* Ngưỡng, không phải chọn cứng một trong hai: trên 8 gian hàng thì mọc ô lọc,
     trên 20 thì mục cuối mở drawer đầy đủ. */
  if (SELLERS.length > 20) h += '<div class="msep"></div><button class="mi" type="button" data-alls="1">Xem tất cả gian hàng…</button>';
  openMenu(el('sellerbtn'), h);
  each(el('menu'), '[data-seller]', function (b) {
    b.onclick = function () {
      var was = S.seller;
      S.seller = b.dataset.seller;
      closeMenu();
      if (was !== S.seller) {
        /* Đổi gian hàng là đổi nghĩa cả màn hình: không giữ lại dòng đang chọn của gian hàng cũ. */
        S.cursor = {}; S.marked = {}; S.query = {}; S.sort = {}; S.pins = [];
        toast('Đang xem gian hàng ' + seller().name + '. Mọi con số trên màn hình đã đổi theo.');
      }
      render();
    };
  });
};

/* ---------------- tài khoản, vai trò, mật độ ---------------- */
el('whobtn').onclick = function () {
  var h = '<div class="mcap">Vai trò đang mô phỏng</div>';
  Object.keys(ROLES).forEach(function (k) {
    var r = ROLES[k];
    h += '<button class="mi" type="button" data-role="' + k + '" aria-current="' + (k === S.role) + '">' +
      '<span class="roledot" style="background:var(--role-' + r.rank + ')"></span>' +
      '<span><b>' + k + '</b><span class="t2">' + r.name + ' · ' + r.perms.length + ' quyền</span></span>' +
      (k === S.role ? '<span class="ck">✓</span>' : '') + '</button>';
  });
  /* Mật độ đổi chiều cao dòng, tức là đổi mọi toạ độ đã học thuộc.
     Nên nó là cấu hình đặt một lần, không phải nút bấm hằng ngày trên thanh trên cùng. */
  h += '<div class="msep"></div><div class="mcap">Mật độ hiển thị · đặt một lần</div>' +
    '<div class="mrow">' +
    ['tight', 'roomy', 'scan'].map(function (d) {
      var nm = d === 'tight' ? 'Chật' : d === 'roomy' ? 'Thoáng' : 'Rất thoáng';
      return '<button type="button" data-dens="' + d + '" aria-pressed="' + (S.density === d) + '">' + nm + '</button>';
    }).join('') + '</div>' +
    '<div class="msep"></div><button class="mi" type="button" data-toastm="Đăng xuất khỏi mọi ứng dụng VOMA trên trình duyệt này.">Đăng xuất</button>';
  openMenu(el('whobtn'), h, 'right');
  each(el('menu'), '[data-role]', function (b) {
    b.onclick = function () { S.role = b.dataset.role; closeMenu(); render(); };
  });
  each(el('menu'), '[data-dens]', function (b) {
    b.onclick = function () { S.density = b.dataset.dens; closeMenu(); render(); };
  });
  each(el('menu'), '[data-toastm]', function (b) {
    b.onclick = function () { closeMenu(); toast(b.dataset.toastm); };
  });
};

/* ---------------- thanh lệnh ---------------- */
var palOpen = false, palIndex = 0;
function palResults() {
  var q = el('palq').value.trim().toLowerCase();
  return commandIndex().filter(function (c) {
    if (!q) return true;
    return (c.label + ' ' + (c.hint || '')).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 24);
}
function renderPal() {
  var rs = palResults(), h = '', sect = null;
  if (!rs.length) {
    h = '<div class="empty"><div class="ttl">Không tìm thấy</div><p>Thử mã đơn, SKU, số hoá đơn, tên khách hàng, hoặc tên việc muốn làm.</p></div>';
  }
  rs.forEach(function (c, i) {
    if (c.group !== sect) { sect = c.group; h += '<div class="sect">' + sect + '</div>'; }
    h += '<div class="it ' + (i === palIndex ? 'hl' : '') + (c.locked ? ' dis' : '') + '" data-i="' + i + '"' +
      (c.locked ? ' aria-disabled="true" title="' + esc(c.reason) + '"' : '') + '><span>' + c.label + '</span>' +
      '<span class="from">' + c.module + '</span></div>';
  });
  el('pallist').innerHTML = h;
  each(el('pallist'), '[data-i]', function (d) { d.onclick = function () { runPal(+d.dataset.i); }; });
}
function runPal(i) {
  var rs = palResults();
  if (!rs[i]) return;
  closePal();
  rs[i].run();
}
function openPal() {
  palOpen = true; palIndex = 0;
  el('palscrim').classList.add('open');
  el('palq').value = '';
  renderPal();
  el('palq').focus();
}
function closePal() { palOpen = false; el('palscrim').classList.remove('open'); }
el('omnibtn').onclick = openPal;
el('palscrim').onclick = function (e) { if (e.target === el('palscrim')) closePal(); };
el('palq').oninput = function () { palIndex = 0; renderPal(); };

/* ---------------- bàn phím ---------------- */
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault(); palOpen ? closePal() : openPal(); return;
  }
  if (palOpen) {
    if (e.key === 'Escape') closePal();
    else if (e.key === 'ArrowDown') { e.preventDefault(); palIndex = Math.min(palIndex + 1, palResults().length - 1); renderPal(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palIndex = Math.max(palIndex - 1, 0); renderPal(); }
    else if (e.key === 'Enter') { e.preventDefault(); runPal(palIndex); }
    return;
  }
  if (e.key === 'Escape') { closeMenu(); closeDrawer(); closeModal(); return; }

  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

  /* hàng đợi việc */
  if (S.screen === 'work') {
    var items = queueItems();
    if (!items.length) return;
    var k = e.key.toLowerCase();
    if (k === 'j' || e.key === 'ArrowDown') { e.preventDefault(); S.qIndex = Math.min(S.qIndex + 1, items.length - 1); render(); }
    else if (k === 'k' || e.key === 'ArrowUp') { e.preventDefault(); S.qIndex = Math.max(S.qIndex - 1, 0); render(); }
    else if (k === 'e' || e.key === 'Enter') { e.preventDefault(); doQueueAction('primary'); }
    else if (k === 'x') { e.preventDefault(); doQueueAction('later'); }
    return;
  }

  /* bàn dữ liệu */
  var ds = DATASETS[S.screen];
  if (!ds) return;
  var rows = filteredRows(S.screen);
  var cur = S.cursor[S.screen] || 0;
  if (e.key === 'ArrowDown') { e.preventDefault(); S.cursor[S.screen] = Math.min(cur + 1, rows.length - 1); S.peekTab = 'sum'; render(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); S.cursor[S.screen] = Math.max(cur - 1, 0); S.peekTab = 'sum'; render(); }
  else if (e.key === ' ') { e.preventDefault(); var r = rows[cur]; if (r) { toggleMark(S.screen, r[ds.key]); render(); } }
  else if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePin(); render(); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    var rr = rows[cur];
    if (rr) openObject(ds.module, ds.kind, rr[ds.key]);
  }
});

render();
</script>
